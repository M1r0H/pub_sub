version: '3.9'

services:
  # Redis Node 1 (Master)
  redis-node-1:
    image: redis:7.0
    ports:
      - "7001:7001"
    command: redis-server --port 7001 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes
    networks:
      - redis-cluster
    restart: always

  # Redis Node 2 (Master)
  redis-node-2:
    image: redis:7.0
    ports:
      - "7002:7002"
    command: redis-server --port 7002 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes
    networks:
      - redis-cluster
    restart: always

  # Redis Node 3 (Master)
  redis-node-3:
    image: redis:7.0
    ports:
      - "7003:7003"
    command: redis-server --port 7003 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes
    networks:
      - redis-cluster
    restart: always

  # Redis Node 4 (Replica of Node 1)
  redis-node-4:
    image: redis:7.0
    ports:
      - "7004:7004"
    command: redis-server --port 7004 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes
    networks:
      - redis-cluster
    restart: always

  # Redis Node 5 (Replica of Node 2)
  redis-node-5:
    image: redis:7.0
    ports:
      - "7005:7005"
    command: redis-server --port 7005 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes
    networks:
      - redis-cluster
    restart: always

  # Redis Node 6 (Replica of Node 3)
  redis-node-6:
    image: redis:7.0
    ports:
      - "7006:7006"
    command: redis-server --port 7006 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes
    networks:
      - redis-cluster
    restart: always

  # Redis Init Container (для создания кластера)
  redis-init:
    image: redis:7.0
    container_name: redis-init
    command: "sh -c 'sleep 5 && redis-cli --cluster create redis-node-1:7001 redis-node-2:7002 redis-node-3:7003 redis-node-4:7004 redis-node-5:7005 redis-node-6:7006 --cluster-replicas 1 --cluster-yes'"
    networks:
      - redis-cluster
    depends_on:
      - redis-node-1
      - redis-node-2
      - redis-node-3
      - redis-node-4
      - redis-node-5
      - redis-node-6
    restart: on-failure

networks:
  redis-cluster:
    driver: bridge
